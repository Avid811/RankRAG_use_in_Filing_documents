version: '3.8'

services:
  elasticsearch:
    # 使用 build 而不是 image，从 Dockerfile 构建
    build:
      context: .
      dockerfile: Dockerfile
    container_name: es-with-ik
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    restart: unless-stopped

volumes:
  es-data:
    driver: local

networks:
  elastic:
    driver: bridge